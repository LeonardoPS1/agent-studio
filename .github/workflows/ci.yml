name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install deps
        working-directory: apps/studio
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: apps/studio
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/studio
        run: npm run test:unit

  # Contract tests contra OpenFang v0.6.9 (opcional en CI local; en entorno GitHub requiere binario/cache)
