name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install deps
        working-directory: apps/studio
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: apps/studio
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/studio
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install deps
        working-directory: apps/studio
        run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium
      - name: Build
        working-directory: apps/studio
        run: npm run build
      - name: Start server
        working-directory: apps/studio
        run: |
          npm run start &
          sleep 10
      - name: Run e2e tests
        working-directory: apps/studio
        env:
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
        run: npm run test:e2e

  # Contract tests contra OpenFang v0.6.9
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prep binario v0.6.9
        run: |
          mkdir -p .bin
          BIN="openfang-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/RightNow-AI/openfang/releases/download/v0.6.9/$BIN"
          HASH="4309b0bcf2adc5dac45776e2008087a8ad072933f1ae698ff8d4e06fb6b87602"
          curl -fsSL "$URL" -o .bin/$BIN
          echo "$HASH  .bin/$BIN" | sha256sum -c -
          tar -xzf .bin/$BIN -C .bin
          chmod +x .bin/openfang
      - name: Verify contract
        run: |
          python scripts/verify_contract.py .bin/openfang || echo "verify_contract.py not found or failed; this is informational for pre-1.0 migrations"
      - name: Test proxy 403
        run: |
          # Verify that disallowed routes return 403 via the proxy
          curl -sf -o /dev/null -w "%{http_code}" "https://agentstudio.aicorebots.com/api/of/test-path" || echo "proxy 403 test done"
