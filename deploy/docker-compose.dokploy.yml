# Compose para Dokploy: OpenFang (motor, interno) + Studio (interfaz, público vía Traefik).
# En Dokploy: Create Service > Compose > Git, ruta de compose: deploy/docker-compose.dokploy.yml
# Variables: pestaña Environment (ver .env.example). El dominio se asigna en la pestaña Domains
# apuntando al servicio "studio", puerto 3000.
services:
  openfang:
    build:
      context: ./openfang
      args:
        OPENFANG_VERSION: ${OPENFANG_VERSION:-v0.6.9}
        OPENFANG_SHA256: ${OPENFANG_SHA256:-4309b0bcf2adc5dac45776e2008087a8ad072933f1ae698ff8d4e06fb6b87602}
    restart: unless-stopped
    environment:
      OPENFANG_API_KEY: ${OPENFANG_API_KEY:?Define OPENFANG_API_KEY}
      OPENFANG_LISTEN: 0.0.0.0:4200
      OPENFANG_HOME: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - openfang-data:/data
      - ./openfang/config.toml:/data/config.toml:ro
    networks: [internal]
    # Sin "ports": el motor NO se publica; solo Studio lo alcanza por la red interna.

  studio:
    build:
      context: ../apps/studio
    restart: unless-stopped
    depends_on:
      openfang:
        condition: service_healthy
    environment:
      OPENFANG_URL: http://openfang:4200
      OPENFANG_API_KEY: ${OPENFANG_API_KEY:?Define OPENFANG_API_KEY}
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:?Define STUDIO_PASSWORD}
      STUDIO_SECRET: ${STUDIO_SECRET:?Define STUDIO_SECRET}
    networks: [internal, dokploy-network]
    # Dominio y HTTPS: configúralos en Dokploy > Domains (servicio studio, puerto 3000).

networks:
  internal:
  dokploy-network:
    external: true

volumes:
  openfang-data:
